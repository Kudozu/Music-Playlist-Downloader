name: Release

# Pousser un tag vX.Y.Z construit le .exe Windows et l'APK Android, puis publie la release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt imageio-ffmpeg pyinstaller

      - name: Construction du .exe
        run: .\build.bat
        shell: cmd

      - name: Vérification rapide
        shell: pwsh
        run: |
          $env:NO_BROWSER = "1"
          $p = Start-Process dist\MusicPlaylistDownloader.exe -PassThru
          $r = $null
          for ($i = 0; $i -lt 30 -and -not $r; $i++) {
            Start-Sleep 3
            try { $r = Invoke-RestMethod http://localhost:5000/api/settings } catch {}
          }
          Stop-Process $p.Id -Force
          if ($r.formats -notcontains "mp3") { throw "ffmpeg absent du .exe" }
          "OK : formats = $($r.formats -join ', ')"

      - name: Version zip (Python, pour les PC qui bloquent l'exe)
        shell: pwsh
        run: |
          $d = "zip\MusicPlaylistDownloader"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item app.py, ytdlp_update.py, requirements.txt, Lancer.bat, icon.ico, README.md $d
          Copy-Item -Recurse static $d
          Compress-Archive -Path $d -DestinationPath dist\MusicPlaylistDownloader-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MusicPlaylistDownloader.exe
            dist/MusicPlaylistDownloader-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5  # Chaquopy a besoin du même Python pour préparer les paquets
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Construction de l'APK
        working-directory: android-app
        env:
          VERSION_NAME: ${{ github.ref_name }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: playlistdownloader
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../PlaylistDownloader.apk

      - name: Activer KVM (émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android-app/ci-smoke-test.sh PlaylistDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PlaylistDownloader.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshot
          path: screenshot.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MusicPlaylistDownloader.exe
            dist/MusicPlaylistDownloader-Windows.zip
            dist/PlaylistDownloader.apk
          body_path: .github/release-notes.md
